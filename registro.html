      <section class="formulario">
        <form action="#" enctype="multipart/form-data" method="post">
          <fieldset>
            <legend>Datos personales</legend>

            <div>
              <label for="nombre">Nombre completo:</label>
              <input type="text" name="nombre" id="nombre" size="40" />
            </div>
            <br />

            <div>
              <label for="fecha">Fecha de nacimiento:</label>
              <input type="date" />
            </div>
            <br />

            <div>
              <label for="email">Correo electrónico:</label>
              <input
                type="email"
                name="email"
                id="email"
                size="25"
                placeholder="ejemplo@gmail.com"
                required
              />
            </div>
            <br />

            <div>
              <label for="dirección">Dirección:</label>
              <input type="text" name="dirección" id="dirección" />
            </div>
          </fieldset>

          <fieldset>
            <legend>Extras</legend>

            <div>
              <label for="pagina">Página Web</label>
              <input type="text" size="50" />
            </div>
            <br />

            <div>
              <label for="foto">Foto</label>
              <input type="file" name="foto" id="foto" class="foto" />
            </div>
            <br />

            <div>
              <label for="biografia">Biografía:</label> <br />
              <textarea
                name="biografia"
                id="biografia"
                rows="5"
                cols="50"
              ></textarea>
            </div>
          </fieldset>

          <div class="botones">
            <input type="reset" name="limpiar" id="limpiar" class="limpiar" />
            <button>Enviar</button>
          </div>
